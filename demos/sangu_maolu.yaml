# 三国故事 · 三顾茅庐 —— 刘备三请诸葛亮：两次未遇，第三次终于请出卧龙先生。
# 有声成片（渲染 + edge-tts 旁白混音）:
#   .venv/bin/python -m animasis narrate demos/sangu_maolu.yaml -o demos/output/sangu_maolu.mp4
# 镜头表:
#   .venv/bin/python -m animasis shots demos/sangu_maolu.yaml
# 仅画面（无声）:
#   .venv/bin/python -m animasis render demos/sangu_maolu.yaml -o /tmp/sangu_silent.mp4
name: sangu_maolu
width: 320
height: 180
fps: 60
duration: 88.0
background: cottage
ground_y: 150
scale: 3
gravity: 420

characters:
  # 刘备: 黄袍、发髻        关羽: 绿袍、红脸、长髯        张飞: 黑衣、虬髯
  - { name: liubei,   preset: hero, x: 164, hair: 1, hair_style: topknot, cloth: 7, skirt: true, sleeves: long }
  - { name: guanyu,   preset: bob,  x: 124, hair: 1, hair_style: topknot, cloth: 15, pants: 24, skirt: true, skin: tan, beard: long }
  - { name: zhangfei, preset: bob,  x: 84,  hair: 1, hair_style: spiky, cloth: 1, pants: 24, skin: medium, beard: short }
  # 诸葛亮: 白袍、羽扇      书童
  - { name: zhuge,    preset: hero, body: slim, x: 222, facing: -1, hair: 1, hair_style: topknot, cloth: 4, skirt: true, sleeves: long, belt: 10, visible: false }
  - { name: shutong,  preset: kid,  x: 222, facing: -1, hair: 1, hair_style: topknot, cloth: 8, pants: 14, visible: false }

objects:
  - { name: fan,    kind: fan,    held_by: zhuge, w: 9, h: 11 }
  - { name: letter, kind: letter, x: -80, y: 140, w: 11, h: 5, dynamic: false }

narration:
  voice: zh-CN-YunjianNeural
  rate: "+5%"
  lines:
    - { t: 0.8,  text: "三顾茅庐。" }
    - { t: 5.0,  text: "东汉末年，天下大乱。刘备想成就一番大业，身边却缺少一位出谋划策的军师。" }
    - { t: 13.8, text: "有人向他推荐：隆中有一位卧龙先生，名叫诸葛亮。" }
    - { t: 21.8, text: "刘备带着关羽、张飞，来到隆中的草庐，登门拜访。" }
    - { t: 27.6, text: "书童说，先生一早就出门了，不知什么时候回来。刘备只好失望而归。" }
    - { t: 37.6, text: "几天后，天降大雪。张飞抱怨：一个村夫，何必亲自去请？刘备不听，冒着风雪又来了。" }
    - { t: 47.4, text: "可诸葛亮又不在家。刘备留下一封书信，写满了自己的诚意。" }
    - { t: 56.6, text: "第二年开春，刘备第三次来到草庐。" }
    - { t: 60.9, text: "诸葛亮正在午睡。刘备不让书童通报，恭恭敬敬地站在门外等候。" }
    - { t: 67.5, text: "诸葛亮醒来，被刘备的诚意打动。" }
    - { t: 71.3, text: "他为刘备分析天下大势，提出三分天下的计策，答应出山相助。" }
    - { t: 78.9, text: "后来，人们用三顾茅庐，比喻真心诚意，一再邀请、拜访有才能的人。" }

# ================= 分镜 / 运镜 (animasis.camera)
# shot: wide 远景 1.0 · full 全景 1.3 · medium 中景 1.7 · close 近景 2.4 · closeup 特写 3.0 · ecu 3.6
# move: 秒数 = 从上一镜位平滑推/拉/摇；缺省 = 硬切。transition: fade = 短暂黑场。flip = 反打（镜像视角）
camera:
  - { t: 0.0,  shot: wide, name: "片头标题卡" }
  # --- 序：推荐卧龙
  - { t: 4.5,  shot: wide, target: [124, 110], transition: fade, fade: 0.6, name: "远景·三兄弟立于山前" }
  - { t: 9.2,  shot: medium, target: [liubei, guanyu], offset: [0, -6], move: 4.0, name: "缓推中景·刘备愁无军师" }
  - { t: 13.8, shot: full, target: [90, 84], name: "远景·隆中山水（有人推荐卧龙）" }
  - { t: 14.0, shot: full, target: [240, 84], move: 2.2, ease: linear, name: "横摇·远山" }
  - { t: 16.2, shot: close, target: liubei, offset: [10, -8], move: 2.4, ease: out, name: "推近景·刘备喜出望外" }
  # --- 一顾
  - { t: 19.0, shot: wide, transition: fade, fade: 0.6, name: "卡片·一顾" }
  - { t: 21.5, shot: full, target: [90, 112], transition: fade, fade: 0.6, name: "全景·兄弟走向草庐" }
  - { t: 22.3, shot: full, target: hut, offset: [-34, -6], move: 3.5, name: "横摇·跟到草庐门前" }
  - { t: 26.0, shot: close, target: [206, 122], name: "近景·刘备叩门「咚咚」" }
  - { t: 27.6, shot: close, target: [shutong, liubei], offset: [0, -10], flip: true, name: "反打越肩·书童答话" }
  - { t: 31.2, shot: full, target: [150, 112], name: "全景·失望而归" }
  # --- 二顾
  - { t: 34.8, shot: wide, transition: fade, fade: 0.6, name: "卡片·二顾" }
  - { t: 37.3, shot: wide, transition: fade, fade: 0.6, name: "广角·风雪赶路" }
  - { t: 41.0, shot: medium, target: [zhangfei, liubei], offset: [0, -8], name: "中景·张飞抱怨" }
  - { t: 44.6, shot: full, target: liubei, offset: [28, -12], name: "全景跟拍·冒雪前行" }
  - { t: 47.0, shot: medium, target: [liubei, shutong], offset: [0, -10], name: "中景·先生又不在" }
  - { t: 48.6, shot: closeup, target: [208, 126], name: "特写·递书信" }
  - { t: 50.4, shot: medium, target: liubei, offset: [14, -10], name: "中景·刘备作揖" }
  - { t: 51.4, shot: wide, name: "远景·风雪中离去" }
  # --- 三顾
  - { t: 53.8, shot: wide, transition: fade, fade: 0.6, name: "卡片·三顾" }
  - { t: 56.3, shot: medium, target: hut, offset: [0, -14], transition: fade, fade: 0.6, name: "中景·春日草庐" }
  - { t: 56.9, shot: wide, move: 2.6, name: "拉远景·兄弟入画" }
  - { t: 59.6, shot: medium, target: [200, 116], name: "中景·门前（书童：嘘）" }
  - { t: 62.8, shot: closeup, target: [278, 120], name: "特写·窗内午睡 zZZ" }
  - { t: 63.8, shot: medium, target: [zhangfei, liubei], offset: [0, -8], name: "中景·门外静候" }
  - { t: 64.4, shot: medium, zoom: 2.0, target: [zhangfei, liubei], offset: [6, -10], move: 3.0, name: "缓推·张飞不耐" }
  - { t: 67.5, shot: close, target: zhuge, offset: [-10, -8], name: "近景·孔明出门" }
  - { t: 69.0, shot: close, target: [liubei, zhuge], offset: [0, -10], flip: true, name: "反打·刘备再拜" }
  - { t: 71.3, shot: close, target: [liubei, zhuge], offset: [0, -10], name: "近景双人·隆中对" }
  - { t: 72.2, shot: closeup, zoom: 2.8, target: [liubei, zhuge], offset: [0, -12], move: 2.4, name: "缓推·三分天下" }
  - { t: 74.6, shot: wide, name: "远景·一同出山" }
  - { t: 78.4, shot: wide, transition: fade, fade: 0.6, name: "成语卡" }

