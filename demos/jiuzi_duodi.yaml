# 清史故事 · 九子夺嫡 —— 康熙晚年，众皇子争夺储位，最终四阿哥胤禛继位为雍正帝。
# 有声成片（渲染 + edge-tts 旁白混音）:
#   .venv/bin/python -m animasis narrate demos/jiuzi_duodi.yaml -o demos/output/jiuzi_duodi.mp4
# 镜头表:
#   .venv/bin/python -m animasis shots demos/jiuzi_duodi.yaml --markdown
# 仅画面（无声）:
#   .venv/bin/python -m animasis render demos/jiuzi_duodi.yaml -o /tmp/jiuzi_silent.mp4
#
# 段落: 片头 | A 康熙与诸皇子(乾清宫) | B 康熙十四年立太子(闪回) | C 一废太子(康熙四十七年) |
#       D 胤禔魇镇被揭发·圈禁 | E 大臣推举胤禩 | F 复立→再废(四十八年 / 五十一年) |
#       G 八爷党 vs 四阿哥(宫院) | H 十四阿哥抚远大将军(西北) | 卡片 康熙六十一年冬 |
#       I 畅春园·隆科多宣遗命 | J 雍正即位 + 「十改于」传说卡 | K 八、九圈禁 · 十四守陵 |
#       L 秘密立储·正大光明匾 | 结尾大事记卡
# 史实取向: 只用通行史书的大事与年号; 台词气泡为示意, 非史料原话。
name: jiuzi_duodi
width: 320
height: 180
fps: 60
duration: 106.0
background: palace_hall
ground_y: 150
scale: 3
gravity: 420

characters:
