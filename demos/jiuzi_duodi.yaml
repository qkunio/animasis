narration:
  voice: zh-CN-YunjianNeural
  rate: "+5%"
  lines:
    - { t: 0.8,   text: "九子夺嫡。" }
    - { t: 5.0,   text: "康熙皇帝在位六十一年，是中国历史上在位最久的皇帝。他儿子众多，皇位却只有一个。" }
    - { t: 13.5,  text: "康熙十四年，年幼的二阿哥胤礽被立为皇太子。" }
    - { t: 18.8,  text: "可太子长大后骄纵失德、结党营私。康熙四十七年，太子被废。" }
    - { t: 26.5,  text: "大阿哥胤禔趁机诅咒太子，被三阿哥胤祉揭发，遭到终身圈禁。" }
    - { t: 32.8,  text: "八阿哥胤禩人缘极好，大臣纷纷推举他，反倒招来康熙猜忌。" }
    - { t: 39.6,  text: "次年胤礽复立，三年后再度被废。康熙从此不再公开立储。" }
    - { t: 46.6,  text: "八阿哥联合九阿哥胤禟、十阿哥胤䄉、十四阿哥胤禵，人称八爷党。" }
    - { t: 53.5,  text: "四阿哥胤禛却吃斋念佛，自称天下第一闲人，暗中与十三阿哥胤祥交好。" }
    - { t: 61.4,  text: "十四阿哥被任命为抚远大将军，出征西北，声望大涨。" }
    - { t: 70.2,  text: "康熙六十一年冬，康熙病逝于畅春园。隆科多宣布遗命：皇四子胤禛继位。" }
    - { t: 78.4,  text: "这就是雍正皇帝。民间传说他把十改成了于，篡改遗诏，但并无实据。" }
    - { t: 86.5,  text: "雍正即位后，八阿哥、九阿哥被圈禁而死，十四阿哥被派去看守皇陵。" }
    - { t: 93.8,  text: "雍正还创立了秘密立储，把继承人的名字藏在乾清宫正大光明匾后。" }
    - { t: 101.0, text: "九子夺嫡，就此落幕。" }

