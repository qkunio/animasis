  bg: 25
  items:
  - {text: 全球导航定位系统（GNSS）, size: 22, color: 7}
  - {text: '@像素万物局', size: 14, color: 31, at: 0.6}
- {kind: caption, t: 0.1, until: 4.252666666666666, text: 打开手机地图，小蓝点立刻知道你在哪儿。, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 4.292666666666666, until: 6.68, text: 它靠的，是天上的卫星。, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 7.4, until: 10.550769230769232, text: GNSS 是全球卫星导航系统的统称：, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 10.590769230769231, until: 14.680000000000001, text: 几十颗卫星，在两万多公里的高空绕着地球飞行。, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 15.4, until: 19.223157894736843, text: 它有四大成员：美国的 GPS、中国的北斗、, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 19.263157894736842, until: 22.700000000000003, text: 俄罗斯的格洛纳斯，还有欧洲的伽利略。, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 23.4, until: 28.079354838709676, text: 每颗卫星都带着极其精准的原子钟，不停地广播：, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 28.119354838709675, until: 30.009999999999998, text: 我是谁，现在几点。, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 30.6, until: 32.67733333333334, text: 手机里的接收机收到信号，, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 32.717333333333336, until: 36.20622222222222, text: 用收到的时间减去发出的时间，再乘以光速，, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 36.24622222222222, until: 38.5, text: 就得到了到这颗卫星的距离。, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 39.2, until: 41.36423076923077, text: 只知道一颗卫星的距离，, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 41.40423076923077, until: 44.370000000000005, text: 你可能在一个大圆上的任何地方。, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 44.8, until: 49.34518518518518, text: 加上第二颗，范围缩小到两个交点；第三颗，, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 49.38518518518518, until: 50.949999999999996, text: 就能锁定位置。, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 51.6, until: 53.821600000000004, text: 可手机的时钟不够精准，, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 53.8616, until: 56.7, text: 还需要第四颗卫星来校正时间。, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 57.3, until: 62.089999999999996, text: 经度、纬度、高度，再加上时间，四个未知数，, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 62.129999999999995, until: 64.38999999999999, text: 所以至少要四颗卫星。, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 65.2, until: 69.28363636363636, text: 如今，开车导航、外卖骑手、共享单车、, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 69.32363636363637, until: 72.72, text: 测绘和授时，都离不开 GNSS。, size: 12, color: 4, reveal: 0}
- {kind: caption, t: 73.4, until: 77.94, text: 看不见的卫星，正时时刻刻告诉你：你在这里。, size: 12, color: 4, reveal: 0}
