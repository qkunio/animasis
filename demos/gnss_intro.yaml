# GNSS 科普 · 全球卫星导航系统是怎么给你定位的？
# 有声成片（渲染 + edge-tts 旁白混音）:
#   .venv/bin/python -m animasis narrate demos/gnss_intro.yaml -o demos/output/gnss_intro.mp4
# 镜头表:   .venv/bin/python -m animasis shots demos/gnss_intro.yaml --markdown
# 段落: A 手机地图 | B 什么是GNSS(星座) | C 四大系统 | D 卫星发信号(原子钟) | E 接收机测距 |
#       F 多星定位(一圆→两交点→锁定) | G 第四颗星校时 + 四个未知数 | H 民用 | I 结尾地球 | 结尾卡
# (geometry: receiver R=(160, 110), satellites A=(100, 82) B=(220, 82) C=(130, 65) D=(205, 70), mirror point R'=(160, 54))
name: gnss_intro
width: 320
height: 180
fps: 60
duration: 82.4
background: market
ground_y: 150
scale: 3
gravity: 420
characters:
- {name: xiaoming, preset: hero, x: 150, hair: 24, hair_style: short, cloth: 6, pants: 25, expression: neutral}
objects:
- {name: phone, kind: phone, held_by: xiaoming, w: 5, h: 7}
narration:
  voice: zh-CN-YunjianNeural
  rate: +5%
  lines:
  - {t: 0.1, text: 打开手机地图，小蓝点立刻知道你在哪儿。它靠的，是天上的卫星。}
  - {t: 7.4, text: GNSS 是全球卫星导航系统的统称：几十颗卫星，在两万多公里的高空绕着地球飞行。}
  - {t: 15.4, text: 它有四大成员：美国的 GPS、中国的北斗、俄罗斯的格洛纳斯，还有欧洲的伽利略。}
  - {t: 23.4, text: 每颗卫星都带着极其精准的原子钟，不停地广播：我是谁，现在几点。}
  - {t: 30.6, text: 手机里的接收机收到信号，用收到的时间减去发出的时间，再乘以光速，就得到了到这颗卫星的距离。}
  - {t: 39.2, text: 只知道一颗卫星的距离，你可能在一个大圆上的任何地方。}
  - {t: 44.8, text: 加上第二颗，范围缩小到两个交点；第三颗，就能锁定位置。}
  - {t: 51.6, text: 可手机的时钟不够精准，还需要第四颗卫星来校正时间。}
  - {t: 57.3, text: 经度、纬度、高度，再加上时间，四个未知数，所以至少要四颗卫星。}
  - {t: 65.2, text: 如今，开车导航、外卖骑手、共享单车、测绘和授时，都离不开 GNSS。}
  - {t: 73.4, text: 看不见的卫星，正时时刻刻告诉你：你在这里。}
