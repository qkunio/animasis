# 石油科普 · 一桶石油，能变出多少东西？
# 有声成片：
#   python -m animasis narrate demos/petroleum.yaml -o demos/output/petroleum.mp4
# 镜头表：
#   python -m animasis shots demos/petroleum.yaml --markdown
# 段落：冷开场 | A 油田与原油 | B 碳氢化合物 | C 分馏塔（6 大馏分）| D 一桶的产出 |
#       E 裂解→乙烯→聚乙烯 | F 产品墙 | G 结尾 | 两行字结尾卡
name: petroleum
width: 320
height: 180
fps: 30
duration: 95.0
background: oilfield
ground_y: 150
scale: 3
gravity: 420
characters:
- {name: xiaoke, preset: hero, x: -16, hat: 7, cloth: 10, pants: 25, hair: 24, hair_style: short, expression: neutral, visible: false}
narration:
  voice: zh-CN-YunjianNeural
  rate: +5%
  lines:
  - {t: 0.8, text: 一桶石油，究竟能变出多少东西？}
  - {t: 5.2, text: 一桶原油，黑乎乎、黏糊糊，看起来平平无奇。}
  - {t: 11.0, text: 可它其实是上千种碳氢化合物的混合物，沸点各不相同。}
  - {t: 17.2, text: 送进分馏塔，加热到约 400 摄氏度，油气一路往上。}
  - {t: 23.2, text: 越往上越冷：沸点高的先凝，沸点低的继续爬。}
  - {t: 28.8, text: 塔顶是石油气，往下是汽油、煤油、柴油，塔底是重油——沥青就来自它。}
  - {t: 37.2, text: 一桶 159 升。以美国炼厂为例：约 46% 汽油，30% 柴油，11% 航空煤油。}
  - {t: 47.2, text: 但分馏只是第一步。真正的魔法，是把馏分拆开再重组。}
  - {t: 53.4, text: 石脑油裂解成乙烯，乙烯再聚合成聚乙烯——塑料瓶就是这么来的。}
  - {t: 61.4, text: 同样的碳和氢，还能变成涤纶衣服、橡胶轮胎、油漆、洗涤剂、阿司匹林和口红。}
  - {t: 70.6, text: 从燃料到塑料、化纤、橡胶、药品、化妆品，再到沥青路，石油能变出上千种产品。}
  - {t: 80.8, text: 一桶石油里装的不只是能量，还有半个现代生活。}
  - {t: 86.6, text: 下一次加油时，别忘了看看周围——你正站在石油里。}
