# Demo 2: Two-person handoff — wave, approach, give a gift
name: two_person_handoff
width: 320
height: 180
fps: 12
duration: 6.0
background: room
ground_y: 145
scale: 3

characters:
  - name: alice
    x: 60
    preset: alice       # long blonde hair, purple dress, slim
    facing: 1
    expression: happy
  - name: bob
    x: 250
    preset: bob         # short black hair, red long sleeves, jeans, stocky
    facing: -1
    expression: neutral
    hat: navy

objects:
  - name: gift
    kind: gift
    x: 60
    y: 100
    held_by: alice
    color: gold

timeline:
  - { t: 0.2, action: cycle, target: alice, name: wave, speed: 1.4 }
  - { t: 0.2, action: cycle, target: bob, name: wave, speed: 1.2 }
  - { t: 1.5, action: walk_to, target: alice, x: 140, speed: 45 }
  - { t: 1.5, action: walk_to, target: bob, x: 180, speed: 40 }
  - { t: 3.2, action: pose, target: alice, name: give }
  - { t: 3.2, action: pose, target: bob, name: receive }
  - { t: 3.5, action: give, target: alice, to: bob, object: gift }
  - { t: 3.5, action: expression, target: bob, name: happy }
  - { t: 3.5, action: expression, target: alice, name: happy }
  - { t: 4.2, action: cycle, target: bob, name: wave, speed: 1.5 }
  - { t: 4.5, action: pose, target: alice, name: idle }
